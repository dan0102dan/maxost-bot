[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "maxost-bot"
version = "0.2.0"
description = "Multi-user MAX ↔ Telegram private-topic bridge"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
maxost = "maxost.main:run"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["maxost*"]

[tool.setuptools.package-data]
maxost = ["migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires TEST_DATABASE_URL", "contract: requires pinned PyMax"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
