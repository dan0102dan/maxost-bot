name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: maxost_test
          POSTGRES_USER: maxost
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U maxost -d maxost_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://maxost:test-only-password@localhost:5432/maxost_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install . -r requirements-dev.txt
      - run: python -m compileall -q maxost scripts
      - run: ruff check maxost tests
      - run: pytest -q
      - run: docker build -t maxost:ci .
